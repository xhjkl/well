[package]
name = "well"
description = "chat with your codebase"
readme = "README.md"
repository = "https://github.com/xhjkl/well"
license = "MIT"
version = "0.0.4"
edition = "2021"
resolver = "2"

[dependencies]
chrono = "0.4.38"
colored = "3.1.1"
dotenvy = "0.15.7"
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
monostate = "1.0.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "native-tls",
    "system-proxy",
] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2.0.0"
tokio = { version = "1.40.0", features = ["full"] }

tree-sitter = "0.27.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.0"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
strip = true
